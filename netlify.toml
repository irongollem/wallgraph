# Netlify build for plattegrond.crocode.nl
# The app is one self-contained file: `npm run build` typechecks, runs the
# bundler, and writes dist/index.html with CSS and JS inlined. Alongside it the
# build emits what only a hosted copy needs — the content pages, robots.txt, the
# sitemap, llms.txt, the web manifest, the JSON Schema and the icons. index.html
# still references none of them and still works opened from disk with no network.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match CI (.github/workflows/ci.yml) so a green CI means a green deploy.
  # Node 20 is end-of-life; 24 is the current LTS.
  NODE_VERSION = "24"

# dist/index.html IS the application — never let a proxy pin an old copy, or
# users keep running a stale editor after a deploy. The same default covers the
# content pages, which are cheap and should always be the current wording.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Plans stay in the browser; the editor needs no device access.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The bundle references no external URL (CI asserts this), so everything may
    # come from this origin only. 'unsafe-inline' is required because the build
    # inlines the script and stylesheet into the HTML. frame-ancestors keeps the
    # door open for embedding on crocode.nl later without allowing the wider web.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self' https://*.crocode.nl https://crocode.nl"

# Icons and the social preview are content-stable and fetched by filename, so a
# week of caching costs nothing and a stale one is invisible. Deliberately below
# the /* rule: Netlify applies the most specific match.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The machine-readable surface: read by crawlers and agents rather than by a
# browser holding a page open, so an hour of staleness is not a stale editor.
[[headers]]
  for = "/wallgraph.schema.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
