name: Release

# Tags, verifies and publishes the version already in package.json.
#
#   1. bump the version in a normal commit:  npm version <patch|minor|major> --no-git-tag-version
#   2. push it like any other change
#   3. run this workflow (Actions tab, or `gh workflow run release.yml`)
#
# It deliberately does NOT write to main. An earlier version ran `npm version`
# in CI and pushed the bump, which the branch ruleset rejects — github-actions[bot]
# holds no bypass, so the push failed AFTER the tag had already gone up, leaving a
# tag that pointed at no branch. Bumping in a normal commit keeps package.json as
# the single source of truth and leaves this workflow read-only on branches.

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Verify BEFORE tagging. A tag that points at a broken commit is worse
      # than no release, and tags are the thing people can't easily take back.
      - run: npm run typecheck
      - run: npm test

      - name: Resolve and tag the version
        id: v
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag $TAG does not match package.json $PKG — bump package.json in a commit first" && exit 1
            fi
          else
            # Refuse to move an existing tag: a released version is immutable.
            if git ls-remote --exit-code --tags origin "refs/tags/$PKG" >/dev/null 2>&1; then
              echo "::error::$PKG is already tagged. Bump package.json (npm version <patch|minor|major> --no-git-tag-version), commit and push, then re-run." && exit 1
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$PKG" -m "Release $PKG"
            # Only the tag ref is pushed — never a branch — so the ruleset is untouched.
            git push origin "refs/tags/$PKG"
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: https://plattegrond.crocode.nl
        run: npm run build

      - name: Verify the bundle is self-contained
        run: npm run check:bundle

      # Ship the built editor as a release asset: one file, runs offline, and is
      # the exact artifact that went live — so a release is reproducible even if
      # the hosting goes away.
      - name: Name the artifact for the release
        run: cp dist/index.html "wallgraph-${{ steps.v.outputs.version }}.html"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: wallgraph-${{ steps.v.outputs.version }}.html
          body: |
            Self-contained build of the Wallgraph editor. Download the `.html`
            asset and open it in any browser — no server, no install, works
            offline. Live version: https://plattegrond.crocode.nl

      # No deploy step: the Netlify site builds from main on every push, so by
      # the time a release is tagged the same commit is already live. Deploying
      # again here would only race the deploy that is already running.
