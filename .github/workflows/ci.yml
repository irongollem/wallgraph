name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify dist is self-contained
        run: |
          test -f dist/index.html
          # No external script/style/asset references may survive bundling.
          if grep -Eq '<(script|link)[^>]+(src|href)="(https?:)?//' dist/index.html; then
            echo "dist/index.html references an external resource" >&2
            exit 1
          fi
          echo "dist/index.html is self-contained ($(du -h dist/index.html | cut -f1))"
